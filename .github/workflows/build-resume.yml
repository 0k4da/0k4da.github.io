name: Build resume PDF

on:
  push:
    branches: [main]
    paths: [data.json, resume.cls, generate_resume.py, build.sh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner so the system fonts (Didot, Avenir Next, Menlo) match local builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: brew install tectonic

      - name: Build resume.pdf
        run: ./build.sh

      - name: Commit updated PDF
        run: |
          if git diff --quiet resume.pdf; then
            echo "resume.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "Rebuild resume.pdf"
          git push
