name: Build resume and site

on:
  push:
    branches: [main]
    paths: [data.json, resume.cls, generate_resume.py, generate_site.py, build.sh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner so the system fonts (Didot, Avenir Next, Menlo) match local builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: brew install tectonic

      - name: Build resume.pdf and site files
        run: ./build.sh

      - name: Commit updated files
        run: |
          git add resume.pdf index.html llms.txt resume.md resume.txt resume.json robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild resume and site files"
          git push
